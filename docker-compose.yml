services:
  gddl:
    build: .
    container_name: gddl
    restart: unless-stopped
    ports:
      - 8099:8080
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=0
    environment:
      - PORT=8080
      - HOST=0.0.0.0
      - DOWNLOAD_DIR=/mnt/hdd-media/downloads
      - CONFIG_DIR=/config
      - EXTRA_DRIVES=/mnt/hdd-media,/mnt/hdd-backup
      - AUTH_ENABLED=true
      - AUTH_USER=admin
      - AUTH_PASS=adminadmin
    volumes:
      - ./config:/config
      - ./warp:/var/lib/cloudflare-warp
      - /mnt/hdd-media/downloads:/downloads
      - /mnt/hdd-media:/mnt/hdd-media:rw
      - /mnt/hdd-backup:/mnt/hdd-backup:rw
